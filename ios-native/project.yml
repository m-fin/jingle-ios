name: Jingle
options:
  bundleIdPrefix: app.jingle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
packages:
  JingleCore:
    path: JingleCore
targets:
  Jingle:
    type: application
    platform: iOS
    sources:
      - path: Jingle
        excludes:
          - Info.plist
          - Jingle.entitlements
          - "Sounds/**"
      # Copied to the app bundle root so UNNotificationSound and AVAudioPlayer
      # both open the CAF files by filename.
      - path: Jingle/Sounds
        type: group
        buildPhase: resources
      - path: Shared
    dependencies:
      - package: JingleCore
        product: JingleCore
      - target: JingleWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.jingle.ios
        PRODUCT_NAME: Jingle
        INFOPLIST_FILE: Jingle/Info.plist
        CODE_SIGN_ENTITLEMENTS: Jingle/Jingle.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: []
  JingleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: JingleWidgets
        excludes:
          - Info.plist
          - JingleWidgets.entitlements
      - path: Shared
    dependencies:
      - package: JingleCore
        product: JingleCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.jingle.ios.widgets
        PRODUCT_NAME: JingleWidgets
        INFOPLIST_FILE: JingleWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: JingleWidgets/JingleWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Jingle:
    build:
      targets:
        Jingle: all
        JingleWidgets: all
    run:
      config: Debug
    archive:
      config: Release
